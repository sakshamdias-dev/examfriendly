<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <script src="theme.js"></script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Examfriendly | Tools</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script src="navbar.js?v=2"></script>
    <script src="footer.js"></script>
    <style type="text/tailwindcss">
        :root { --deep-sky-blue: #00BFFF; --brand-orange: #FF8C00; }
        @layer base {
            .bg-deep-sky-blue { background-color: var(--deep-sky-blue); }
            .text-deep-sky-blue { color: var(--deep-sky-blue); }
            .bg-brand-orange { background-color: var(--brand-orange); }
            .text-brand-orange { color: var(--brand-orange); }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#00BFFF", "accent": "#FF8C00" },
                    fontFamily: { "display": ["Lexend", "sans-serif"] }
                }
            }
        };
    </script>
</head>
<header class="relative z-[100]">
    <exam-navbar></exam-navbar>
</header>
<body class="font-display pt-24 bg-white text-slate-900 dark:bg-slate-950 dark:text-white antialiased overflow-x-hidden">
    <main class="max-w-7xl mx-auto py-16 px-6">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-black text-slate-900 dark:text-white mb-4">Tools</h1>
            <p class="text-slate-500">Useful tools and quick links for students.</p>
        </div>

        <div id="tools-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 p-5 shadow-sm">
                <div class="px-2">
                    <h3 class="text-xl font-bold text-slate-800 dark:text-white">Loading tools...</h3>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <exam-footer></exam-footer>
    </footer>
</body>
<script>
const _supabaseUrl = 'https://qomhhffaetgwjvifgcai.supabase.co';
const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvbWhoZmZhZXRnd2p2aWZnY2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyMzY2NjQsImV4cCI6MjA4NjgxMjY2NH0.4Uf9enXmwlMEGZez8E9tNOzfh9AA74qcTUz15yfz1lQ';
const supabaseClient = supabase.createClient(_supabaseUrl, _supabaseKey);

function escapeHTML(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function renderFallbackTools() {
    const grid = document.getElementById('tools-grid');
    grid.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 p-5 shadow-sm hover:shadow-2xl transition-all duration-300 flex flex-col group">
            <div class="relative overflow-hidden rounded-[1.8rem] mb-6 bg-slate-50 dark:bg-slate-800 min-h-[220px] flex items-center justify-center">
            ${tool.image_url 
                ? `<img src="${tool.image_url}" class="w-20 h-20 object-contain" />`
                : `<span class="material-icons text-primary text-7xl">${escapeHTML(tool.icon || 'build')}</span>`
            }
            </div>
            <div class="px-2 flex flex-col flex-1">
                <h3 class="text-2xl font-bold mb-3 text-slate-800 dark:text-white">Examination Portal</h3>
                <p class="text-slate-500 dark:text-slate-300 mb-6">Access the official examination dashboard, updates, and exam links.</p>
                <div class="mt-auto">
                    <a href="https://exam.examfriendly.in" target="_blank" class="block w-full bg-primary text-white text-center py-4 rounded-2xl font-bold text-sm shadow-lg shadow-primary/20">
                        Open Examination
                    </a>
                </div>
            </div>
        </div>
    `;
}

function renderTools(rows) {
    const grid = document.getElementById('tools-grid');
    if (!rows.length) {
        renderFallbackTools();
        return;
    }

    grid.innerHTML = rows.map((tool) => `
        <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 p-5 shadow-sm hover:shadow-2xl transition-all duration-300 flex flex-col group">
            <div class="relative overflow-hidden rounded-[1.8rem] mb-6 bg-slate-50 dark:bg-slate-800 min-h-[220px] flex items-center justify-center">
                <span class="material-icons text-primary text-7xl">${escapeHTML(tool.icon || 'build')}</span>
            </div>
            <div class="px-2 flex flex-col flex-1">
                <h3 class="text-2xl font-bold mb-3 text-slate-800 dark:text-white">${escapeHTML(tool.name || 'Untitled Tool')}</h3>
                <p class="text-slate-500 dark:text-slate-300 mb-6">${escapeHTML(tool.description || 'No description added yet.')}</p>
                <div class="mt-auto">
                    <a href="${escapeHTML(tool.link || '#')}" target="_blank" class="block w-full bg-primary text-white text-center py-4 rounded-2xl font-bold text-sm shadow-lg shadow-primary/20">
                        ${escapeHTML(tool.button_text || 'Open Tool')}
                    </a>
                </div>
            </div>
        </div>
    `).join('');
}

async function loadTools() {
    try {
        const { data, error } = await supabaseClient
            .from('tools')
            .select('*')
            .order('created_at', { ascending: false });
        if (error) throw error;
        renderTools(data || []);
    } catch (err) {
        console.error(err);
        renderFallbackTools();
    }
}

loadTools();
</script>
</html>
